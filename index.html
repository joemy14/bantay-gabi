  <title>bantay gabi · Files</title>
  <style>
    :root {
      --bg-1: #000000; --bg-2: #1a0000; --red: #e10600; --red-soft: #ff3b3b;
      --text: #f5f5f5; --muted: #a89c9c; --glass: rgba(255,255,255,.05);
      --border: rgba(255,60,60,.25); --ok: #7ef0b5; --err: #ff6b6b; --warn: #ffd27a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif; color: var(--text);
      background: radial-gradient(circle at 20% 10%, var(--bg-2), var(--bg-1) 70%);
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 20px) 16px 40px; }
    h1 {
      font-size: 28px; margin: 0 0 4px;
      background: linear-gradient(90deg, var(--red-soft), var(--red));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
    .card {
      background: var(--glass); border: 1px solid var(--border); border-radius: 20px;
      padding: 18px; margin-bottom: 16px;
    }
    h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    input, select, textarea {
      width: 100%; padding: 13px 14px; margin-bottom: 10px;
      border-radius: 12px; border: 1px solid var(--border);
      background: rgba(0,0,0,.7); color: var(--text);
      font: inherit; font-size: 15px; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--red-soft); }
    textarea {
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
      min-height: 300px; resize: vertical; line-height: 1.45;
    }
    textarea.small { min-height: 70px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > * { flex: 1 1 130px; }
